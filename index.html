const $=s=>document.querySelector(s);

const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const now=()=>Date.now(),day=()=>new Date().toLocaleDateString('sv');
const STEP=[5*6e4,30*6e4,12*36e5,864e5,2*864e5,4*864e5,7*864e5,15*864e5];

function rec(w,ok){const e=S.st[w]||(S.st[w]={seen:0,wr:0,cw:0,cs:0,stage:0,last:0,next:0,fav:0,note:''});
 e.seen++;e.last=now();
 if(ok){e.cs++;e.cw=0;if(e.wr){e.stage=Math.min(e.stage+1,7);e.next=now()+STEP[e.stage]}}
 else{e.wr++;e.cw++;e.cs=0;e.stage=0;e.next=now()+STEP[0]}}
const status=e=>!e.wr?'—':e.cs>=2?'✅已掌握':e.next<=now()?'⚠️待复习':'❌未掌握';
const speak=w=>{if(!S.set.speak||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(w);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)};
let AC;function beep(f=880){if(!S.set.sound)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.1)}catch(e){}}
const COM=[[95,'太棒了，你的单词量太大了'],[90,'非常优秀，掌握程度很高！'],[85,'很不错，大部分单词都记住了'],[80,'良好，少量单词需要巩固'],[75,'及格偏上，还有部分单词需要复习'],[70,'刚达标，重点复习错题'],[60,'基础薄弱，优先巩固错题本词汇'],[0,'需要多加练习，建议反复复习错题']];
const comment=s=>COM.find(c=>s>=c[0])[1];

let view='home',Q=null;
const NAV=[['home','首页 / 开始测试'],['wrong','错题本'],['fav','收藏词本'],['vocab','词库管理'],['stat','数据统计'],['set','设置']];
function go(v){if(Q&&!Q.done&&!confirm('正在做题，离开将丢失本次进度，确定吗？'))return;if(Q){cancelAnimationFrame(Q.raf);Q=null}view=v;draw()}
function draw(){document.documentElement.dataset.t=S.set.theme;
 $('#nav').innerHTML='<span class="brand">单词抗遗忘记忆</span>'+NAV.map(([k,n])=>`<button class="${k===view?'on':''}" onclick="go('${k}')">${n}</button>`).join('');
 $('#app').innerHTML=Q?'':({home,wrong,fav,vocab,stat,set}[view])();if(Q)Q.done?result():showQ()}
window.onbeforeunload=e=>{if(Q&&!Q.done){e.preventDefault();e.returnValue=''}};

function counts(){const E=Object.values(S.st),wr=E.filter(e=>e.wr);return{seen:E.length,mast:wr.filter(e=>e.cs>=2).length,due:wr.filter(e=>e.cs<2&&e.next<=now()).length,wr:wr.length}}
function home(){const c=counts(),t=S.days[day()]||{n:0,ok:0},tags=[...new Set(VV.map(x=>x[4]).filter(Boolean))];
 return `<div class="card"><div class="g"><div><b>${VV.length}</b><span class="m">词库总数</span></div><div><b>${c.seen}</b><span class="m">已做过</span></div><div><b>${c.mast}</b><span class="m">已掌握</span></div><div><b>${c.due}</b><span class="m">待复习错题</span></div><div><b>${t.n}</b><span class="m">今日题量</span></div><div><b>${t.n?Math.round(t.ok/t.n*100):0}%</b><span class="m">今日正确率</span></div></div>
 <p class="m">掌握率（已掌握/已做过）</p><div class="bar"><i style="width:${c.seen?c.mast/c.seen*100:0}%"></i></div></div>
 <div class="card"><p>四选一（A/B/C/D 选其一，键盘 A-D 或 1-4 也可作答）。每套 ${S.set.n} 题，每题 ${(100/S.set.n).toFixed(1).replace('.0','')} 分，限时 ${S.set.sec} 秒。优先抽取待复习错题，其余随机抽新词。</p>
 <p>词库范围：<select id="tag"><option value="">全部</option>${tags.map(t=>`<option>${esc(t)}</option>`).join('')}</select></p>
 <div class="row"><button class="pri" onclick="start(true)">限时测试</button><button onclick="start(false)">无压力复习</button><button onclick="start(true,1)">仅收藏词</button></div></div>`}

function mk(w){const dir=S.set.dir==='mix'?(Math.random()<.5?'en':'zh'):S.set.dir;
 const base=VV.filter(x=>x[0]!==w[0]&&x[3]!==w[3]),same=base.filter(x=>x[2]===w[2]);
 const opts=shuf([w,...pick(same.length>=12?same:base,3)]);return{w,dir,opts,ci:opts.indexOf(w)}}
function start(timed,favOnly){const tag=($('#tag')||{}).value||'';let pool=VV.filter(x=>!tag||x[4]===tag);
 if(favOnly)pool=pool.filter(x=>(S.st[x[0]]||{}).fav);if(pool.length<4)return alert(favOnly?'收藏词不足（至少 4 个）':'词库不足 4 个');
 const n=S.set.n,ps=new Set(pool.map(x=>x[0]));let list=[];
 for(const [w,e] of shuf(Object.entries(S.st)))if(e.wr&&e.next<=now()&&ps.has(w)){const x=byW(w);if(x)for(let k=0;k<(e.cw>0?Math.min(e.cw,3):1);k++)list.push(x)}
 list=list.slice(0,n);const used=new Set(list.map(x=>x[0])),rc=new Set(S.recent);
 let fresh=shuf(pool.filter(x=>!used.has(x[0])&&!rc.has(x[0])));if(fresh.length<n)fresh=fresh.concat(shuf(pool.filter(x=>!used.has(x[0])&&rc.has(x[0]))));
 list=shuf(list.concat(fresh.slice(0,n-list.length)));
 Q={list,i:0,ok:0,wrongs:[],timed,done:false,locked:false};draw()}

function showQ(){const q=Q.cur=mk(Q.list[Q.i]),w=q.w;Q.locked=false;
 $('#app').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><span>第 ${Q.i+1}/${Q.list.length} 题 · ${Q.timed?'限时':'无压力'}</span><span><button onclick="S.set.sound=!S.set.sound;save();this.textContent=S.set.sound?'🔊':'🔇'">${S.set.sound?'🔊':'🔇'}</button></span></div>
 ${Q.timed?'<div class="bar" style="margin:8px 0"><i id="tb" style="width:100%"></i></div>':''}
 <div style="margin:14px 0">${q.dir==='en'?`<div class="big">${esc(w[0])} <button onclick="speak('${esc(w[0])}')">🔊</button></div><div class="m">/${esc(w[1])}/ ${esc(w[2])}</div>`:`<div class="m">${esc(w[2])}</div><div class="big" style="font-size:22px">${esc(w[3])}</div>`}</div>
 ${q.opts.map((x,i)=>`<button class="o" id="o${i}" onclick="ans(${i})"><span class="L">${'ABCD'[i]}</span><span>${esc(q.dir==='en'?x[3]:x[0])}</span></button>`).join('')}<div id="fb"></div></div>`;
 if(q.dir==='en')speak(w[0]);
 if(Q.timed){beep();const t0=performance.now(),T=S.set.sec*1000;const tick=()=>{const p=(performance.now()-t0)/T;const b=$('#tb');if(b){b.style.width=Math.max(0,100-p*100)+'%';if(p>.7)b.style.background='var(--no)'}if(p>=1)ans(-1);else Q.raf=requestAnimationFrame(tick)};Q.raf=requestAnimationFrame(tick)}}
function showQ0(){draw()}
function ans(k){if(!Q||Q.locked||Q.done)return;Q.locked=true;cancelAnimationFrame(Q.raf);const q=Q.cur,w=q.w,ok=k===q.ci;
 rec(w[0],ok);const d=S.days[day()]||(S.days[day()]={n:0,ok:0});d.n++;if(ok)d.ok++;save();
 if(ok)Q.ok++;else if(!Q.wrongs.includes(w))Q.wrongs.push(w);
 q.opts.forEach((_,i)=>{const b=$('#o'+i);b.disabled=true;if(i===q.ci)b.classList.add('ok');else if(i===k)b.classList.add('no')});
 $('#fb').innerHTML=(ok?'<p style="color:var(--ok)">✔️ 正确</p>':`<p style="color:var(--no)">❌ ${k<0?'超时':'错误'}</p><p><b>${esc(w[0])}</b> /${esc(w[1])}/ ${esc(w[2])} ${esc(w[3])}</p>`)+(Q.timed?'':'<button class="pri" onclick="next()">下一题（Enter）</button>');
 if(Q.timed)setTimeout(next,ok?700:1600)}
function next(){if(!Q||!Q.locked)return;Q.i++;if(Q.i>=Q.list.length)finish();else showQ()}
function finish(){Q.done=true;const n=Q.list.length;Q.score=Math.round(Q.ok/n*100);
 S.recent=[...S.recent,...Q.list.map(x=>x[0])].slice(-300);
 if(Q.timed)S.hist.push({t:now(),score:Q.score,n,ok:Q.ok,wrongs:Q.wrongs.map(x=>x[0])});save();draw()}
function result(){$('#app').innerHTML=`<div class="card"><div class="big">${Q.timed?Q.score+' 分':'复习完成'}</div><p>答对 ${Q.ok}/${Q.list.length}${Q.timed?' · '+comment(Q.score):''}</p><button class="pri" onclick="Q=null;draw()">返回首页</button></div>
 <div class="card"><b>本次错题（${Q.wrongs.length}）</b>${Q.wrongs.map(wl).join('')||'<p>全部答对 🎉</p>'}</div>`}
const wl=x=>{const e=S.st[x[0]]||{};return `<div class="w"><b>${esc(x[0])}</b> /${esc(x[1])}/ ${esc(x[2])} ${esc(x[3])}<div class="row"><button onclick="speak('${esc(x[0])}')">🔊</button><button onclick="fv('${esc(x[0])}')">${e.fav?'★已收藏':'☆收藏'}</button></div></div>`};
function fv(w){const e=S.st[w]||(S.st[w]={seen:0,wr:0,cw:0,cs:0,stage:0,last:0,next:0,fav:0,note:''});e.fav=e.fav?0:1;save();draw()}
document.addEventListener('keydown',e=>{if(!Q||Q.done)return;const k='abcd1234'.indexOf(e.key.toLowerCase());if(k>=0)ans(k%4);else if(e.key==='Enter'&&!Q.timed)next()});

function wrong(){const L=Object.entries(S.st).filter(([,e])=>e.wr).sort((a,b)=>b[1].last-a[1].last);
 return `<div class="card row"><button onclick="exportWrong()">导出 CSV</button><button onclick="clearWrong()">清空错题本</button><span class="m">共 ${L.length} 个</span></div><div class="card">${L.map(([w,e])=>{const x=byW(w)||[w,'','',''];return `<div class="w"><b>${esc(w)}</b> /${esc(x[1])}/ ${esc(x[2])} ${esc(x[3])}<div class="m">错 ${e.wr} 次 · ${status(e)} · 上次 ${new Date(e.last).toLocaleString()}${e.note?' · 笔记：'+esc(e.note):''}</div><div class="row"><button onclick="speak('${esc(w)}')">🔊</button><button onclick="fv('${esc(w)}')">${e.fav?'★':'☆'}</button><button onclick="note('${esc(w)}')">笔记</button><button onclick="delW('${esc(w)}')">删除</button></div></div>`}).join('')||'<p class="m">暂无错题</p>'}</div>`}
function note(w){const v=prompt('个人笔记',S.st[w].note);if(v!==null){S.st[w].note=v;save();draw()}}
function delW(w){const e=S.st[w];e.wr=0;e.cw=0;e.cs=0;e.stage=0;save();draw()}
function clearWrong(){if(confirm('确定清空全部错题？'))Object.values(S.st).forEach(e=>{e.wr=0;e.cw=0;e.cs=0;e.stage=0});save();draw()}
function dl(name,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type:'text/csv;charset=utf-8'}));a.download=name;a.click()}
const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
function exportWrong(){dl('错题本.csv','单词,音标,词性,释义,错误次数,状态,笔记\n'+Object.entries(S.st).filter(([,e])=>e.wr).map(([w,e])=>{const x=byW(w)||[w,'','',''];return [x[0],x[1],x[2],x[3],e.wr,status(e),e.note].map(q).join(',')}).join('\n'))}
function fav(){const L=Object.entries(S.st).filter(([,e])=>e.fav).map(([w])=>byW(w)).filter(Boolean);return `<div class="card row"><button class="pri" onclick="start(true,1)">用收藏词组卷测试</button><span class="m">共 ${L.length} 个</span></div><div class="card">${L.map(wl).join('')||'<p class="m">点单词旁的 ☆ 收藏</p>'}</div>`}

let pend=[];
function vocab(){return `<div class="card"><p>当前词库 ${VV.length} 个（内置 ${W.length}，导入 ${S.extra.length}）。导入格式：每行 <code>单词,音标,释义,标签</code>（标签可省略；释义里请用中文逗号）。</p><textarea id="imp" placeholder="acquit,əˈkwit,宣告无罪,法律"></textarea><div class="row"><button onclick="prev()">预览检查</button><button class="pri" onclick="doImp()">确认导入</button><button onclick="exportV()">导出全部词库</button><button onclick="clearX()">清除导入词</button></div><div id="pv" class="m"></div></div>`}
function prev(){const err=[];pend=[];$('#imp').value.split('\n').forEach((l,i)=>{if(!l.trim())return;const p=l.split(/\t|,/).map(s=>s.trim());if(p.length<3||p.length>4||!p[0]||!p[2])err.push(`第 ${i+1} 行格式错误`);else pend.push([p[0],p[1],'',p[2],p[3]||'自定义'])});
 $('#pv').innerHTML=(err.length?`<p style="color:var(--no)">${err.join('<br>')}</p>`:'')+`<p>可导入 ${pend.length} 条：${pend.slice(0,5).map(x=>esc(x[0]+' '+x[3])).join(' ｜ ')}</p>`}
function doImp(){prev();if(!pend.length)return;S.extra=S.extra.concat(pend);loadV();save();draw()}
function clearX(){if(confirm('清除全部导入词？')){S.extra=[];loadV();save();draw()}}
function exportV(){dl('词库备份.csv','单词,音标,词性,释义,标签\n'+VV.map(x=>x.map(q).join(',')).join('\n'))}

function stat(){const c=counts(),H=S.hist.slice(-30),tot=Object.values(S.days).reduce((a,d)=>a+d.n,0);
 const pts=H.map((h,i)=>`${H.length>1?i*290/(H.length-1)+5:150},${95-h.score*.9}`).join(' ');
 return `<div class="card"><div class="g"><div><b>${S.hist.length}</b><span class="m">累计试卷</span></div><div><b>${tot}</b><span class="m">累计题量</span></div><div><b>${c.wr}</b><span class="m">错题总数</span></div></div><p class="m">近 30 次得分走势</p><svg viewBox="0 0 300 100" style="width:100%;background:var(--bg);border-radius:8px"><polyline fill="none" stroke="var(--p)" stroke-width="2" points="${pts}"/></svg></div>
 <div class="card"><b>历史试卷</b>${S.hist.slice().reverse().map(h=>`<div class="w">${new Date(h.t).toLocaleString()} · <b>${h.score} 分</b>（${h.ok}/${h.n}）<div class="m">错题：${esc(h.wrongs.join('，')||'无')}</div></div>`).join('')||'<p class="m">暂无记录</p>'}</div>`}

function set(){const s=S.set;return `<div class="card"><p>每套题数 <input type="number" min="4" max="100" value="${s.n}" onchange="S.set.n=Math.max(4,+this.value||20);save()"></p><p>单题限时（秒）<input type="number" min="1" max="30" value="${s.sec}" onchange="S.set.sec=Math.max(1,+this.value||4);save()"></p>
 <p>答题方向 <select onchange="S.set.dir=this.value;save()">${[['en','英译中'],['zh','中译英'],['mix','混合']].map(([k,n])=>`<option value="${k}" ${s.dir===k?'selected':''}>${n}</option>`).join('')}</select></p>
 <p><label><input type="checkbox" ${s.sound?'checked':''} onchange="S.set.sound=this.checked;save()"> 提示音</label> <label><input type="checkbox" ${s.speak?'checked':''} onchange="S.set.speak=this.checked;save()"> 单词发音</label></p>
 <p>主题 <select onchange="S.set.theme=this.value;save();draw()"><option value="light" ${s.theme==='light'?'selected':''}>浅色</option><option value="dark" ${s.theme==='dark'?'selected':''}>深色</option></select></p></div>`}
draw();
</script></body></html>
